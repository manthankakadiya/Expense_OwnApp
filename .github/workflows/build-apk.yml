name: Build Android APK (expense.apk)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build expense.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Prepare Output APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/expense.apk
          ls -lh output/expense.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expense.apk
          path: output/expense.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "expense.apk (v1.0.0)"
          body: |
            ### 📱 Download expense.apk for Android
            
            Installable APK for your Android phone.
            
            1. Download **`expense.apk`** below.
            2. Open the downloaded file on your Android phone.
            3. Tap **Install** (allow *Install unknown apps* for your browser if prompted).
            4. The app will install with the name **expense.app** on your phone!
          files: output/expense.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
